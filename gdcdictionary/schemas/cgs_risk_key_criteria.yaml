      - "NA"

  has_bi_del1p32:
    $ref: "_terms.yaml#/has_bi_del1p32/common"
    enum:
      - "TRUE"
      - "FALSE"
      - "NA"

  has_del1p32:
    $ref: "_terms.yaml#/has_del1p32/common"
    enum:
      - "TRUE"
