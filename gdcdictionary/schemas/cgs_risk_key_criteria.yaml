$schema: "http://json-schema.org/draft-04/schema#"

id: "cgs_risk_key_criteria"
title: CGS Risk Key Criteria
type: object
namespace: https://gdc.cancer.gov
category: clinical
project: '*'
program: '*'
description: >-
  Baseline patient-level Clinical Genomic Scoring (CGS) risk classification and
  key criteria for multiple myeloma.
additionalProperties: false
submittable: true
downloadable: true
previous_version_downloadable: true
validators: null

systemProperties:
  - id
  - project_id
  - created_datetime
  - updated_datetime
  - state

links:
  - name: cases
    backref: cgs_risk_key_criteria
    label: describes
    target_type: case
    multiplicity: one_to_one
    required: true

required:
  - submitter_id
  - type
  - cgs_risk_category
  - cases

uniqueKeys:
  - [id]
  - [project_id, submitter_id]

properties:

  $ref: "_definitions.yaml#/ubiquitous_properties"

  cgs_risk_category:
    $ref: "_terms.yaml#/cgs_risk_category/common"
    enum:
      - "High"
      - "Standard"
      - "NA"

  criteria_1:
    $ref: "_terms.yaml#/criteria_1/common"
    enum:
      - "TRUE"
      - "FALSE"
      - "NA"

  criteria_2:
    $ref: "_terms.yaml#/criteria_2/common"
    enum:
      - "TRUE"
      - "FALSE"
      - "NA"

  criteria_3:
    $ref: "_terms.yaml#/criteria_3/common"
    enum:
      - "TRUE"
      - "FALSE"
      - "NA"

  criteria_4:
