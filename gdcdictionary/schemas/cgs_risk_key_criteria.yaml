      - "FALSE"
      - "NA"

  has_t414:
    $ref: "_terms.yaml#/has_t414/common"
    enum:
      - "TRUE"
      - "FALSE"
      - "NA"

  has_t1416:
    $ref: "_terms.yaml#/has_t1416/common"
    enum:
      - "TRUE"
      - "FALSE"
      - "NA"

  has_t1420:
    $ref: "_terms.yaml#/has_t1420/common"
